<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h3>Nama : Jasmine </h3>
    <h3>NIM : 20250140208 </h3>

    <p>
        Kota :
        <span id="lokasi"></span>

    </p>

    <hr>

    <p> 
        Koordinat : 
        <span id="negara"></span>
    </p>

    <script>
        fetch("/api/lokasi")
            .then(response => response.json())
            .then (data => {
            console.log(data);
            document.getElementById("lokasi").innerHTML = data.kota;
            document.getElementById("negara").innerHTML =
                data.koordinat;
        })
        .catch(error => {
            console.error(error);
        });

    </script>
</body>
</html>
