<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelacak Lokasi - Jasmine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
    --paper:#e8eef2; --ink:#14213d; --line:#b9c6d2; --card:#f7fafc; --pin:#e4317f; --sea:#cfe0ea;
}
*{box-sizing:border-box}
body{
    margin:0; min-height:100vh; color:var(--ink);
    font-family:"Bricolage Grotesque",system-ui,sans-serif;
    background:
      repeating-radial-gradient(circle at 15% 10%, transparent 0 34px, rgba(20,33,61,.06) 35px 36px),
      repeating-radial-gradient(circle at 90% 85%, transparent 0 46px, rgba(20,33,61,.06) 47px 48px),
      var(--paper);
    display:flex; justify-content:center; padding:32px 16px;
}
main{width:100%; max-width:920px}
header{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:24px}
h1{font-size:clamp(2.2rem,6vw,4rem); line-height:.95; margin:0; font-weight:800; letter-spacing:-.03em}
.id{font-size:.95rem; text-align:right; line-height:1.4}
form{display:flex; gap:10px; background:var(--card); border:2px solid var(--ink); border-radius:14px; padding:8px; box-shadow:6px 6px 0 var(--ink)}
input{flex:1; min-width:0; border:0; background:transparent; font:inherit; font-size:1.25rem; padding:10px 12px; color:var(--ink)}
input:focus{outline:none}
form:focus-within{outline:3px solid var(--pin); outline-offset:3px}
button{font:inherit; font-weight:600; border:0; border-radius:9px; background:var(--pin); color:#fff; padding:0 22px; cursor:pointer}
button:hover{filter:brightness(.92)}
button:disabled{opacity:.6; cursor:wait}
.grid{display:grid; grid-template-columns:1.1fr 1fr; gap:20px; margin-top:28px}
@media(max-width:720px){.grid{grid-template-columns:1fr} .id{text-align:left}}
.panel{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px}
.map svg{width:100%; height:auto; display:block; border-radius:8px; background:var(--sea)}
.pin{transition:transform .9s cubic-bezier(.2,.9,.2,1)}
.pulse{animation:pulse 1.6s ease-out infinite; transform-box:fill-box; transform-origin:center}
@keyframes pulse{from{transform:scale(.4);opacity:.9}to{transform:scale(2.6);opacity:0}}
.lokasi{font-size:1.15rem; font-weight:600; margin:0 0 14px; min-height:1.5em}
dl{margin:0}
.row{display:flex; justify-content:space-between; gap:12px; padding:11px 0; border-bottom:1px dashed var(--line)}
.row:last-child{border:0}
dt{color:#5a6b80}
dd{margin:0; font-weight:600; text-align:right}
.coords{display:flex; gap:12px; margin-top:14px}
.coord{flex:1; background:var(--ink); color:#fff; border-radius:10px; padding:12px 14px}
.coord small{display:block; opacity:.7}
.coord b{font-size:1.5rem; font-variant-numeric:tabular-nums}
#pesan{margin-top:16px; font-weight:600}
#pesan.err{color:#b3123f}
@media(prefers-reduced-motion:reduce){.pin{transition:none}.pulse{animation:none}}
</style>
</head>
<body>
<main>
    <header>
        <h1>Di mana<br>tempat itu?</h1>
        <div class="id">Nama: Jasmine<br>NIM: 20250140208</div>
    </header>

    <form id="form">
        <input id="input" type="text" placeholder="Lokasi: mis. Kasihan, Bantul" aria-label="Lokasi" required autofocus>
        <button id="btn" type="submit">Cari lokasi</button>
    </form>
    <div id="pesan" role="status">Ketik nama tempat lalu tekan Cari lokasi.</div>

    <div class="grid">
        <section class="panel map" aria-label="Posisi di peta dunia">
            <svg viewBox="0 0 360 180" role="img" aria-label="Peta koordinat">
                <g stroke="rgba(20,33,61,.18)" stroke-width=".5">
                    <path d="M0 90H360M0 45H360M0 135H360M90 0V180M180 0V180M270 0V180"/>
                </g>
                <path d="M0 90H360M180 0V180" stroke="rgba(20,33,61,.4)" stroke-width=".8"/>
                <g id="pin" class="pin" style="transform:translate(180px,90px);opacity:.25">
                    <circle class="pulse" r="4" fill="#e4317f"/>
                    <circle r="3.5" fill="#e4317f" stroke="#fff" stroke-width="1.5"/>
                </g>
            </svg>
        </section>

        <section class="panel" aria-live="polite">
            <p class="lokasi" id="lokasi">Belum ada lokasi</p>
            <dl>
                <div class="row"><dt>Negara</dt><dd id="negara">-</dd></div>
                <div class="row"><dt>Provinsi</dt><dd id="provinsi">-</dd></div>
                <div class="row"><dt>Kecamatan</dt><dd id="kecamatan">-</dd></div>
            </dl>
            <div class="coords">
                <div class="coord"><small>Longitude</small><b id="longitude">-</b></div>
                <div class="coord"><small>Latitude</small><b id="latitude">-</b></div>
            </div>
        </section>
    </div>
</main>

<script>
const $ = (id) => document.getElementById(id);

if (location.protocol === "file:") {
    $("pesan").className = "err";
    $("pesan").textContent = "Halaman ini dibuka dari file. Jalankan npm run dev, lalu buka http://localhost:3000";
}

$("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = $("input").value.trim();
    if (!q) return;

    $("btn").disabled = true;
    $("pesan").className = "";
    $("pesan").textContent = "Mencari...";

    try {
        const res = await fetch(`/api/lokasi?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);

        $("lokasi").textContent = data.lokasi;
        $("negara").textContent = data.negara;
        $("provinsi").textContent = data.provinsi;
        $("kecamatan").textContent = data.kecamatan;
        $("longitude").textContent = data.longitude.toFixed(5);
        $("latitude").textContent = data.latitude.toFixed(5);

        // posisi pin pada peta dunia (equirectangular 360x180)
        const x = data.longitude + 180, y = 90 - data.latitude;
        $("pin").style.transform = `translate(${x}px,${y}px)`;
        $("pin").style.opacity = 1;
        $("pesan").textContent = "Lokasi ditemukan.";
    } catch (err) {
        $("pesan").className = "err";
        $("pesan").textContent = err.message || "Terjadi kesalahan. Coba lagi.";
    } finally {
        $("btn").disabled = false;
    }
});
</script>
</body>
</html>
